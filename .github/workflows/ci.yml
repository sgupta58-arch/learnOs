name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APP_ENV: testing
  APP_NAME: LearnOS
  DEBUG: "false"
  LOG_LEVEL: WARNING
  DATABASE_URL: postgresql+asyncpg://learnos:learnos@localhost:5432/learnos
  TEST_DATABASE_URL: postgresql+asyncpg://learnos:learnos@localhost:5432/learnos_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET_KEY: ci-test-secret-key
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  CORS_ORIGINS: '["http://localhost:3000"]'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnos
          POSTGRES_PASSWORD: learnos
          POSTGRES_DB: learnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-3.12-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Create test database
        run: |
          PGPASSWORD=learnos psql -h localhost -U learnos -d learnos -c "CREATE DATABASE learnos_test;" || true

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Run Black
        run: poetry run black --check .

      - name: Run isort
        run: poetry run isort --check .

      - name: Run tests
        run: poetry run pytest --cov=app --cov-report=term-missing
