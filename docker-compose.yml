services:
  postgres:
    image: postgres:16-alpine
    container_name: learnos-postgres
    environment:
      POSTGRES_USER: learnos
      POSTGRES_PASSWORD: learnos
      POSTGRES_DB: learnos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnos -d learnos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - learnos-network

  redis:
    image: redis:7-alpine
    container_name: learnos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - learnos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnos-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://learnos:learnos@postgres:5432/learnos
      TEST_DATABASE_URL: postgresql+asyncpg://learnos:learnos@postgres:5432/learnos_test
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - learnos-network

volumes:
  postgres_data:
  redis_data:

networks:
  learnos-network:
    driver: bridge
